name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @tbr/bench exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - name: Tests, end-to-end under Node, Bun and Deno
        run: pnpm test
        env:
          E2E_RUNTIMES: node,bun,deno
      - name: TypeScript 7.1 API spike
        run: pnpm --filter spike-ts71 run router
      - name: Bench smoke (quick)
        run: node bench/run.mjs core --quick --runtimes=node,chromium
