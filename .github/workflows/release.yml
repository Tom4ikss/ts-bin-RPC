name: release

# Publishes ts-bin-rpc to npm with provenance when a tag v<version> is pushed, for example
# v0.1.0-alpha.1. The package must carry that version. Prereleases go to the dist-tag
# named by their first identifier (alpha, beta, rc), releases to latest. latest follows a prerelease
# too, so that a plain `npm install ts-bin-rpc` gets it, while there is no release without a
# prerelease identifier, and a beta or rc also when it is above every such release (1.0.0-beta.0
# after 0.6.0).
#
# Run by hand (workflow_dispatch) it only moves a dist-tag: `alpha=0.2.0` points alpha at 0.2.0,
# `alpha=` removes it. It lives here because npm trusts this workflow file and nothing else, and it
# needs main among the refs the npm environment allows.
#
# Authentication: npm trusted publishing (OIDC), no token. The package on npmjs.com has a trusted
# publisher: GitHub Actions, repository Tom4ikss/ts-bin-RPC, workflow release.yml, environment npm.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dist-tag:
        description: 'tag=version to point a dist-tag at a version, tag= to remove it'
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (11.5.1 or later)
        run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @tbr/bench exec playwright install --with-deps chromium firefox
      - name: Versions match the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          actual=$(node -p "require('./packages/ts-bin-rpc/package.json').version")
          if [ "$actual" != "$version" ]; then echo "ts-bin-rpc is $actual, the tag is $GITHUB_REF_NAME"; exit 1; fi
          case "$version" in
            *-*) pre="${version#*-}"; tag="${pre%%.*}" ;;
            *) tag=latest ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tarballs install and run in an empty project
        run: node scripts/pack-smoke.mjs
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          cd packages/ts-bin-rpc && pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Publish
        run: |
          npm publish "$RUNNER_TEMP"/pack/ts-bin-rpc-*.tgz --provenance --access public --tag "${{ steps.version.outputs.tag }}"
      - name: Move latest while there is no stable release
        if: steps.version.outputs.tag != 'latest'
        run: |
          spec="ts-bin-rpc@${{ steps.version.outputs.version }}"
          # A new version takes a few minutes to become visible after publishing.
          for i in $(seq 1 30); do
            [ -n "$(npm view "$spec" version 2>/dev/null)" ] && break
            sleep 20
          done
          follow=$(npm view ts-bin-rpc versions --json | TAG="${{ steps.version.outputs.tag }}" VERSION="${{ steps.version.outputs.version }}" node -e '
            const base = (v) => v.split("-")[0].split(".").map(Number);
            const above = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i]; return false; };
            const stable = [].concat(JSON.parse(require("fs").readFileSync(0, "utf8"))).filter((v) => !v.includes("-"));
            const late = ["beta", "rc"].includes(process.env.TAG) && stable.every((v) => above(base(process.env.VERSION), base(v)));
            console.log(stable.length === 0 || late ? "yes" : "no");
          ')
          if [ "$follow" = yes ]; then npm dist-tag add "$spec" latest; else echo "latest stays on the stable release"; fi
      - name: Move prerelease tags that fell behind the stable release
        if: steps.version.outputs.tag == 'latest'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # alpha on 0.1.0-alpha.3 after 0.2.0 is out would install an older version than latest. A tag
          # moves when its release part is not above the new version: 0.3.0-alpha.1 stays, and so does
          # a tag already on a newer stable version.
          for i in $(seq 1 30); do
            [ -n "$(npm view "ts-bin-rpc@$VERSION" version 2>/dev/null)" ] && break
            sleep 20
          done
          npm view ts-bin-rpc dist-tags --json | node -e '
            const tags = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const base = (v) => v.split("-")[0].split(".").map(Number);
            const above = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i]; return false; };
            for (const [tag, v] of Object.entries(tags))
              if (tag !== "latest" && v !== process.env.VERSION && !above(base(v), base(process.env.VERSION))) console.log(tag);
          ' | while read -r tag; do npm dist-tag add "ts-bin-rpc@$VERSION" "$tag"; done

  dist-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - name: Move the dist-tag
        env:
          SPEC: ${{ inputs.dist-tag }}
        run: |
          tag="${SPEC%%=*}"
          version="${SPEC#*=}"
          case "$SPEC" in *=*) ;; *) echo "expected tag=version or tag=, got '$SPEC'"; exit 1 ;; esac
          if [ "$tag" = latest ] && [ -z "$version" ]; then echo "latest cannot be removed"; exit 1; fi
          if [ -n "$version" ]; then npm dist-tag add "ts-bin-rpc@$version" "$tag"; else npm dist-tag rm ts-bin-rpc "$tag"; fi
          npm dist-tag ls ts-bin-rpc
